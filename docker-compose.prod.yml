name: drafin

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: drafin-caddy
    restart: unless-stopped
    env_file: .env.production
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nextjs:
        condition: service_started
      mcp-sse:
        condition: service_started

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL}
        NEXT_PUBLIC_MCP_SERVER_URL: ${NEXT_PUBLIC_MCP_SERVER_URL}
    container_name: drafin-nextjs
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_STORAGE_URL=${NEXT_PUBLIC_STORAGE_URL}
      - NEXT_PUBLIC_MCP_SERVER_URL=${NEXT_PUBLIC_MCP_SERVER_URL}
    depends_on:
      mcp-sse:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  mcp-sse:
    build:
      context: ./mcp-sse
      dockerfile: Dockerfile
    container_name: drafin-mcp-sse
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - GEMINI_API=${GEMINI_API}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          
volumes:
  caddy_data:
  caddy_config:
