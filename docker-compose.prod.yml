services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL}
        NEXT_PUBLIC_MCP_SERVER_URL: ${NEXT_PUBLIC_MCP_SERVER_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY}
        NEXT_PUBLIC_MIDTRANS_SNAP: ${NEXT_PUBLIC_MIDTRANS_SNAP}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # server-side only (tanpa NEXT_PUBLIC_)
      GROQ_API: ${GROQ_API}
      # dipakai juga di server component / route handler
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL}
      NEXT_PUBLIC_MCP_SERVER_URL: ${NEXT_PUBLIC_MCP_SERVER_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY}
      NEXT_PUBLIC_MIDTRANS_SNAP: ${NEXT_PUBLIC_MIDTRANS_SNAP}
    depends_on:
      mcp-sse:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  mcp-sse:
    build:
      context: ./mcp-sse
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      NODE_ENV: production
      PORT: 8081
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      ASSEMBLY_API: ${ASSEMBLY_API}
      SSE_ASSEMBLY_API: ${SSE_ASSEMBLY_API}
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  dokploy-network:
    external: true